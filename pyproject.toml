[project]
name = "sdom"
version = "0.2.6"
readme = "README.md"
authors = [
    { name = "Omar Jose Guerra Fernandez", email = "OmarJose.GuerraFernandez@nlr.gov" },
    { name = "Mariya Koleva", email = "Mariya.Koleva@nlr.gov" },
    { name = "Sebastian de Jesus Manrique Machado", email = "SebastiandeJesus.Machado@nlr.gov" },
]
maintainers = [
    { name = "Omar Jose Guerra Fernandez", email = "OmarJose.GuerraFernandez@nlr.gov" },
    { name = "Mariya Koleva", email = "Mariya.Koleva@nlr.gov" },
    { name = "Sebastian de Jesus Manrique Machado", email = "SebastiandeJesus.Machado@nlr.gov" },
    { name = "Pedro Andres Sanchez Perez", email = "pedroandres.sanchezperez@nlr.gov" },
]
description = "A Python package for NLR's open-source SDOM (Storage Deployment Optimization Model)"
license = {file = "LICENSE.txt"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.4.6,<2.5.0; python_version < '3.12'",
    "numpy>=2.5.3,<3.0.0; python_version >= '3.12'",
    "pandas>=2.3.3,<3.0.0",
    "pyomo==6.10.1",
    "highspy==1.15.1",
    "matplotlib>=3.11.2,<4.0.0",
]


[project.urls]
Homepage = "https://github.com/NatLabRockies/SDOM"
Repository = "https://github.com/NatLabRockies/SDOM"
Issues = "https://github.com/NatLabRockies/SDOM/issues"

[project.optional-dependencies]
xpress = ["xpress>=9.7.0,<9.8"]  # Upper bound depends on your license version
infrasys = [
    "infrasys>=1.2.1,<2.0.0",
    "pydantic>=2.13.5,<3.0.0",
    "r2x-core>=0.8.0,<1.0.0",
]

[build-system]
requires = ["uv_build>=0.12.16,<1.0.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-benchmark>=5.3.0,<6.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.16.8,<1.0.0",
    "ty>=0.0.82,<1.0.0",
    {include-group = "docs"},
]
docs = [
    "autodoc-pydantic>=2.2.0,<3.0.0",
    "docstr-coverage>=2.3.2,<3.0.0",
    "ghp-import>=2.1.0,<3.0.0",
    "myst-parser>=5.1.0,<6.0.0",
    "sphinx-rtd-theme>=3.1.0,<4.0.0",
    "sphinx>=9.0.4,<9.1.0; python_version < '3.12'",
    "sphinx>=9.1.0,<10.0.0; python_version >= '3.12'",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-autodoc-typehints>=3.6.1,<3.13.7; python_version < '3.12'",
    "sphinx-autodoc-typehints>=3.13.7,<4.0.0; python_version >= '3.12'",
    "sphinx-copybutton>=0.5.2,<1.0.0",
    "sphinx-design>=0.7.0",
    "sphinx-reports>=0.10.0,<0.11.0; python_version < '3.12'",
    "sphinx-reports>=0.11.2,<1.0.0; python_version >= '3.12'",
    "sphinx-tabs>=3.5.0,<4.0.0",
    "sphinxcontrib-mermaid>=2.1.1,<3.0.0",
]


[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = [
    "--cov=sdom",
    "--cov-report=term-missing",
    "--import-mode=importlib",
    "-v"
]
markers = [
    "integration: marks tests as integration tests (may require solver binaries and full data)",
    "slow: marks tests that require extended execution time",
    "bench_quick: fast/stable benchmark cases intended for frequent branch comparisons",
    "bench_deep: slower end-to-end benchmark cases intended for manual or nightly runs",
]

[tool.ruff]
line-length = 110
extend-exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "D",      # pyddoc
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie
    "PERF",   # perflint (performance)
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B027",   # Empty method in abstract class without @abstractmethod (intentional for hooks)
]


[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Ignore `D` rules everywhere except for the `src/` directory.
"!src/**.py" = ["D", "S101"]

[tool.ruff.lint.mccabe]
# Cyclomatic complexity threshold
max-complexity = 10

